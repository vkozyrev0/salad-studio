name: checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install
        run: python -m pip install -r requirements.txt
      - name: Suite
        run: python -m unittest discover -s tests -p "test_*.py"
      - name: Queue submission check
        run: python .claude/skills/queue-submission-safety/check.py
      - name: Klein dependency
        run: python -m pip install -r salad_klein/requirements.txt
      - name: Klein suite
        working-directory: salad_klein
        run: python -m unittest discover -p "test_*.py"

  ui:
    runs-on: windows-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - name: Install
        run: npm ci
      - name: Build
        run: npx ng build
      # `ui/dist` is not committed. With no build on disk the server must make
      # one and serve it, which is what a fresh clone asks of it.
      - name: The server builds its page when none is present
        working-directory: .
        run: |
          python -c "import sys; sys.path.insert(0, 'salad_studio')
from salad_studio.web import app
assert not (app.DIST / 'index.html').exists(), 'a build is already on disk'
assert app.build_page(), 'build_page did not build'
assert (app.DIST / 'index.html').is_file()
assert app.build_page() is False, 'an unchanged source was built twice'"

      - name: Unit tests
        run: npx ng test --watch=false
      - name: Template bindings
        run: node audit.cjs
